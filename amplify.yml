version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Staging: call staging API over HTTPS directly (avoids Amplify/CloudFront 413 on large uploads).
        # All other branches (main/prod) keep calling pmsapi — do not change that path.
        - |
          if [ "$AWS_BRANCH" = "staging" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL=https://staging-pmsapi.customfurnish.com/api/auth" >> .env.production
            echo "NEXT_PUBLIC_S3_IMAGE_BASE_URL=https://test-products-customfurnish.s3.ap-southeast-1.amazonaws.com" >> .env.production
            echo "NEXT_PUBLIC_SITE_URL=https://productstg.customfurnish.in" >> .env.production
          else
            echo "NEXT_PUBLIC_API_BASE_URL=https://pmsapi.customfurnish.com/api/auth" >> .env.production
            echo "NEXT_PUBLIC_SITE_URL=https://product.customfurnish.com" >> .env.production
            export API_PROXY_TARGET=""
          fi
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
